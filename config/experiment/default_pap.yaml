# Pay-As-Produced (PAP) contract, single base-case run.
# This file is the complete specification for one simulation:


# Simulation label
sim_name: default_pap

# Contract
contract_type: pap
barter: false

# Apply time-value discounting to annual cash flows.
# Annual discount rates. 0.0 = no discounting (all years weighted equally).
discount: false
D_G: 0.0
D_L: 0.0

# Risk aversion weight: 0 = risk-neutral, 1 = fully risk-averse (CVaR only).
# Utility = (1 - A) * E[pi] + A * CVaR_alpha[pi]
# These move the STRIKE much more than the volume. With gamma unbounded and
# symmetric info at load_scale=1.0, A_G from 0 to 1 moves gamma* only 2.36 -> 1.21,
# and A_G = 0 removes the only brake on gamma entirely (it diverges).
A_L: 0.5
A_G: 0.5

# Negotiation power: load's share of Nash surplus. Generator gets 1 - tau_L.
tau_L: 0.5

# CVaR confidence level (tail probability). 0.95 = worst 5% of scenarios.
# This is what makes a contract worth signing at all: the mean effect of gamma is
# exactly zero-sum under symmetric information, so all gains from trade come from
# the two parties' loss tails containing different scenarios.
alpha: 0.95

# Asymmetric information biases on price and production beliefs.
# 0.0 = unbiased. >0 = optimistic, <0 = pessimistic.
# Set to 0.0 for a symmetric-information base case.
K_G_price: 0.0
K_L_price: 0.0
K_G_prod: 0.0
K_L_prod: 0.0

# Generator nameplate capacity [MW]. Must match scenario_gen.capacity_mw.
# 30 MW produces about 98.7 GWh/year on this scenario set.
generator_contract_capacity: 30

# When true, contract_amount_min is set equal to contract_amount_max, fixing M
# so only S is optimised. Used by the contract_size sensitivity sweep.
fix_contract_size: false

# Strike price bounds [EUR/GWh]
strikeprice_min: 0.040
strikeprice_max: 0.200

# PHYSICAL cap on the contracted share: a plant cannot sell more than it generates.
gamma_max: 1.0

# TREASURY cap on the contracted share, as a fraction of the buyer's own exposure.
# null disables it (default, matching the paper as written).
#
# Why this exists: the contract is a financial CfD, so nothing is physically
# delivered and the buyer does resell surplus at market. There is therefore no
# physical penalty for over-contracting, and the model exploits that. The real limit
# is a hedge-designation rule: a corporate treasury may not hold a hedge larger than
# the exposure it hedges, because the excess is speculation rather than hedging.
#
# hedge_ratio_max = 1.0 means "contract at most 100% of consumption", giving
# gamma <= load_over_prod. Combined with gamma_max the binding cap is
# min(gamma_max, hedge_ratio_max * load_over_prod).
#   load_scale 0.54 + hedge_ratio_max 1.0  ->  gamma* = 0.800, hedge ratio 100%
#   load_scale 1.00 + hedge_ratio_max 1.0  ->  gamma* = 1.000, hedge ratio  67%
hedge_ratio_max: null

# Multiplicative scale applied to the load's consumption after scenario loading.

load_scale: 0.4
