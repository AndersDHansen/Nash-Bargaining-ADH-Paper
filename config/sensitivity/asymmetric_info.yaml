# Sensitivity: heterogeneous price beliefs. Each party shifts its belief about the mean
# price by K times the expected price (K > 0 optimistic, K < 0 pessimistic) and values
# both the contract and its merchant position under its own belief. All other parameters
# (A_G, A_L, tau_L) come from the experiment config.
# Odd n so the grid contains K = 0 and the diagonal K_G = K_L (common beliefs).
type: asymmetric_info

K_G_price:
  start: -0.5
  end: 0.5
  n: 21          # step 0.05

K_L_price:
  start: -0.5
  end: 0.5
  n: 21
