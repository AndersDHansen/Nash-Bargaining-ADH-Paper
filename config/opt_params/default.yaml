# Risk aversion weight: 0 = risk-neutral (maximize expected profit),
# 1 = fully risk-averse (maximize CVaR only).
# Utility = (1 - A) * E[pi] + A * CVaR_alpha[pi]
A_L: 0.5
A_G: 0.5

# Load's share of the Nash bargaining surplus; generator gets 1 - tau_L.
# tau_L = 0 → generator takes all surplus; tau_L = 1 → load takes all surplus.
tau_L: 0.5

# Confidence level for CVaR (tail probability).
# 0.95 means we consider the worst 5% of scenarios.
alpha: 0.95

# Annual discount rates for generator (G) and load (L).
# 0.0 = no discounting (all years treated equally).
D_G: 0.0
D_L: 0.0

# Asymmetric information: each party may hold biased beliefs about prices and production.
# 0.0 = unbiased; >0 = optimistic; <0 = pessimistic.
# Price and production biases are kept separate because sensitivity analyses vary them independently.
K_G_price: 0.0
K_L_price: 0.0
K_G_prod: 0.0
K_L_prod: 0.0

# Maximum contractable capacity in MW. Must match scenario_gen.capacity_mw.
generator_contract_capacity: 30

# Retail electricity price paid by load outside the contract [EUR/MWh].
# Currently set to zero (load buys at spot).
retail_price: 0.001

# Strike price lower bound [EUR/MWh].
strikeprice_min: 0.040
# Upper bound is computed at runtime as:
#   strikeprice_max = strikeprice_max_factor * E_prob[price * load_capture_rate]
# Adjust this factor to tighten or widen the optimizer's search space.
strikeprice_max_factor: 1.2

# Maximum fraction of production that can be contracted under PAP.
gamma_max: 1.0
