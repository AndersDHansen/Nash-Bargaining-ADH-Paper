# Pay-As-Produced (PAP) contract — single base-case run.
# This file is the complete specification for one simulation:
# contract settings, model parameters, and output routing in one place.

# Simulation label
sim_name: default_pap

# Contract
contract_type: pap
barter: false

# Apply time-value discounting to annual cash flows.
# Annual discount rates. 0.0 = no discounting (all years weighted equally).
discount: false
D_G: 0.08
D_L: 0.08

# Risk aversion weight: 0 = risk-neutral, 1 = fully risk-averse (CVaR only).
# Utility = (1 - A) * E[pi] + A * CVaR_alpha[pi]
A_L: 0.5
A_G: 0.5

# Negotiation power: load's share of Nash surplus. Generator gets 1 - tau_L.
tau_L: 0.5

# CVaR confidence level (tail probability). 0.95 = worst 5% of scenarios.
alpha: 0.95

# Asymmetric information biases on price and production beliefs.
# 0.0 = unbiased. >0 = optimistic, <0 = pessimistic.
# Price and production are kept separate for independent sensitivity sweeps.
K_G_price: 0.0
K_L_price: 0.0
K_G_prod: 0.0
K_L_prod: 0.0

# Generator nameplate capacity [MW]. Must match scenario_gen.capacity_mw.
generator_contract_capacity: 30

# Strike price bounds [EUR/GWh]
strikeprice_min: 0.040
strikeprice_max: 0.200

# Maximum fraction of production contractable under PAP.
gamma_max: 1.0