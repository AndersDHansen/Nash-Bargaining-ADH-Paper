# Sensitivity: sweep of negotiation power (tau_L) from 0 to 1,
# at each of three discrete A_L values with A_G fixed at 0.5.
# tau_G = 1 - tau_L is derived at runtime.
# tau_L = 0 => generator has all bargaining power; tau_L = 1 => load has all.
type: bargaining_power

tau_L:
  start: 0.0
  end: 1.0
  n: 101

A_G: 0.5

A_L:
  discrete: [0.25, 0.5, 0.75]
