# Sensitivity: joint sweep of risk-aversion weights for both parties.
# All combinations of A_G x A_L are solved - produces a 2D heatmap of S, delta, Nash product.
# n = 21: steps of 0.05 (20 x 20 cells between the grid lines). Keep n odd so that 0.5,
# the base case, is a grid point: earnings, surplus_parts, barter_set and buyer_size read it.
type: risk_aversion

A_G:
  start: 0.0
  end: 1.0
  n: 21

A_L:
  start: 0.0
  end: 1.0
  n: 21
