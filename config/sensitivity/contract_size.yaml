# Sensitivity: sweep contract size with discrete A_L and tau_L combinations.
# A_G is fixed at 0.5. Contract size is held fixed; only S is optimised.
# Baseload (experiment=default_baseload): sweeps M_MW (generator_contract_capacity 0→30).
# PAP     (experiment=default_pap):       sweeps gamma (0→1).
type: contract_size

M_MW:
  start: 0.0
  end: 30.0
  n: 40

gamma:
  start: 0.0
  end: 1.0
  n: 40

A_G: 0.5

A_L:
  discrete: [0.25, 0.5, 0.75]

tau_L:
  discrete: [0.0, 0.5, 1.0]
